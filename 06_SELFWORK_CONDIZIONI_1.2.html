<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork_condizioni_1.2</title>
</head>
<body>
    


    <script>

        let v = 22;

        switch(true){
            case v < 18:
                console.log(`insufficiente`);
                break;
            case v >= 18 && v < 21:
                console.log(`sufficiente`);
                break;
            case v >= 21 && v < 24:
                console.log(`buono`);
                break;
            case v >= 14 && v < 27:
                console.log(`distinto`);
                break;
            case v >= 27 && v <= 29:
                console.log(`ottimo`);
                break;
            case v = 30:
                console.log(`eccellente`);
                break;
        }

    </script>
</body>
</html>
